version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      uv-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # swmmio 0.8.3..0.8.6 pins pyswmm<2, which downgrades uv.lock from pyswmm 2.1 to 1.5.
      - dependency-name: "swmmio"
        versions: [">=0.8.3,<0.9"]
      # pyswmm 2.2.0 pulls swmm-toolkit 0.17.0, whose macOS arm64 wheel has an invalid libomp signature.
      - dependency-name: "pyswmm"
        versions: ["2.2.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
