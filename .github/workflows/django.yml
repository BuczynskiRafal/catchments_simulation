name: Django CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  build:
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # uv would otherwise use the 3.12 pinned in .python-version for every matrix entry.
      UV_PYTHON: ${{ matrix.python-version }}

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: uv sync --frozen --group web

    - name: Lint and Format Check
      run: |
        uv run ruff check cs_app/
        uv run ruff format --check cs_app/

    - name: Check Pending Migrations
      run: |
        SECRET_KEY=ci-secret DATABASE_URL=sqlite:///:memory: uv run python cs_app/manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: |
        export DJANGO_SETTINGS_MODULE=cs_app.test_settings
        uv run pytest cs_app/main/tests/ cs_app/register/tests.py --cov=cs_app/main --cov=cs_app/register --cov-fail-under=90

    - name: Upload coverage reports to Codecov
      if: ${{ github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Minimize uv cache
      run: uv cache prune --ci

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: uv sync --frozen --group web --group e2e

    - name: Install Playwright browser
      run: uv run playwright install --with-deps chromium

    - name: Run Playwright E2E tests (headless)
      run: |
        export DJANGO_SETTINGS_MODULE=cs_app.test_settings
        uv run pytest cs_app/e2e -m e2e --browser chromium --tracing off --video off --screenshot off

    - name: Minimize uv cache
      run: uv cache prune --ci

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build Django Docker image
      run: docker build -t catchment-simulations:ci -f cs_app/Dockerfile .

    - name: Smoke test Docker container
      run: |
        docker run -d --name cs-smoke \
          -p 8000:8000 \
          -e SECRET_KEY=ci-smoke-secret \
          -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
          -e SECURE_SSL_REDIRECT=False \
          catchment-simulations:ci
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status": "ok"'; then
            docker rm -f cs-smoke
            exit 0
          fi
          sleep 1
        done
        docker logs cs-smoke
        docker rm -f cs-smoke
        exit 1
