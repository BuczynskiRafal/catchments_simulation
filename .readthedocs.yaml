version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc

sphinx:
  configuration: docs/source/conf.py

# Read the Docs runs `uv sync` against pyproject.toml and uv.lock. The docs
# group carries Sphinx; the web group is needed because docs/source/conf.py
# calls django.setup() for the cs_app pages.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
        - web

formats:
  - htmlzip
