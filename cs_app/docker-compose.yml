services:
  db:
    image: postgres:16-alpine
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-django_cs}
      - POSTGRES_USER=${POSTGRES_USER:-django_cs}
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-django_cs} -d $${POSTGRES_DB:-django_cs}"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: cs_app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgres://${POSTGRES_USER:-django_cs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-django_cs}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
    depends_on:
      db:
        condition: service_healthy
